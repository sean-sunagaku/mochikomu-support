    <meta charset="utf-8">

  <body>
    <main>
      <header>
        <p class="eyebrow">Webページを、Markdownでコピー</p>
        <h1>もちこむ</h1>
        <p>ブラウザの共有メニューから、見出しやリストを保ったMarkdownをクリップボードへコピーします。</p>
        <nav aria-label="サイト内リンク">
          <a href="support.html">サポート</a>
          <a href="privacy-policy.html">プライバシーポリシー</a>
          <a href="licenses.html">オープンソースライセンス</a>
          <a href="review-sample.html">変換サンプル</a>
        </nav>
      </header>

      <section>
        <h2>3ステップでコピー</h2>
        <ol>
          <li>ブラウザでWebページを開き、共有メニューから「もちこむ」を選びます。</li>
          <li>端末上でページを構造付きMarkdownへ変換し、クリップボードへコピーします。</li>
          <li>「完了」で共有画面を閉じ、使いたいアプリへ貼り付けます。</li>
        </ol>
      </section>

      <p class="note">アカウント登録、広告、トラッキング、利用状況解析はありません。</p>
